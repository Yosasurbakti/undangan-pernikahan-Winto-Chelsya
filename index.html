<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding of Winto & Chelsya</title>
    <!-- Import Font Elegan dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Video / Image Animasi -->
    <div class="bg-container">
        <!-- Background HD -->
        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000&auto=format&fit=crop" alt="Background HD" class="bg-image">
        <div class="overlay"></div>
    </div>

    <!-- Konten Utama Undangan -->
    <main class="invitation-container">
        <section class="hero">
            <div class="content fade-in-up">
                <p class="subtitle">THE WEDDING OF</p>
                <h1 class="title">WINTO & CHELSYA</h1>
                
                <div class="divider"></div>
                
                <p class="quote">
                    "So they are no longer two, but one flesh. <br>
                    Therefore what God has joined together, <br>
                    let no one separate."
                </p>
                <p class="verse">Matthew 19 : 6</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
